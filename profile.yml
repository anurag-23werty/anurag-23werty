# ──────────────────────────────────────────────────────────────────────────────
#  profile-terminal · configuration
#  Edit this file, push, and the workflow re-renders every panel. Nothing else to touch.
#  Engine: https://github.com/billpwchan/profile-terminal (MIT)
# ──────────────────────────────────────────────────────────────────────────────

# GitHub account whose data fills the GitHub panels. Empty = the repository owner.
github_user: ""

# auto  → sample data while the repo is named "profile-terminal", real data in a profile repo.
demo: auto

# amber · phosphor · ice · magenta   (accent: "#hex" overrides the preset's colour)
theme: amber
accent: ""

# Your timezone: drives the clock, session states and the commit-hour histogram.
timezone: Asia/Kolkata

# Static art shown above the terminal panels (kept in this repo).
banner:
  src: assets/output.gif
  alt: Anurag Choudhury

identity:
  name: ANURAG CHOUDHURY
  role: AI/ML ENGINEER · BHUBANESWAR
  # Five function-code rows. Codes are 2–5 letters, values up to ~48 characters.
  rows:
    - [EDGE, "Agentic AI, RAG and graph-aware LLM systems"]
    - [BUILD, "Telemetry -> detectors -> explained alerts"]
    - [DATA, "PostgreSQL warehouses, ETL, star schemas"]
    - [EDU, "B.Tech CSE (AI & ML), OUTR · CGPA 9.26"]
    - [NOW, "Open to AI/ML engineering internships, 2027"]

# Up to five keys under the hero. `auto: github` shows live stars and followers.
links:
  - { code: WEB, title: Portfolio, sub: terminal site, url: "https://personal-portfolio-swart-pi-92.vercel.app" }
  - { code: IN, title: LinkedIn, sub: in/anurag-choudhury, url: "https://www.linkedin.com/in/anurag-choudhury-63a780206/" }
  - { code: MAIL, title: Email, sub: Drop me a line, url: "mailto:24110387@outr.ac.in" }
  - { code: IG, title: Instagram, sub: "@anurag_23y", url: "https://www.instagram.com/anurag_23y/" }
  - { code: GH, auto: github }

# Two or four repositories shown as cards with their real star history.
work:
  status: "SELECTED PROJECTS · PYTHON · SQL · GRAPHS"
  repos:
    - { repo: sql-data-warehouse-project, tag: DATA ENG, pitch: "PostgreSQL medallion data warehouse", sub: "CRM + ERP -> bronze/silver/gold star schema" }
    - { repo: SatPred, tag: SPACE ML, pitch: "Explainable satellite health monitoring", sub: "NASA SMAP/MSL, 331 tests, 97% coverage" }
    - { repo: FastFrame, tag: TOOLING, pitch: "Finds slow pandas code, rewrites it safely", sub: "Up to 332x faster, output verified" }
    - { repo: VulnGraph, tag: SECURITY, pitch: "Graph-aware vulnerability triage agent", sub: "FalkorDB + LangGraph, ranks by attack path" }
  banners: []

# ── LAB: live markets (all keyless public data) ───────────────────────────────
markets:
  tape:
    - { symbol: ^NSEI, label: NIFTY, risk: true, equity: true, session: NSE }
    - { symbol: ^BSESN, label: SENSEX, risk: true, equity: true, session: NSE }
    - { symbol: ^NSEBANK, label: BANKNIFTY, risk: true, session: NSE }
    - { symbol: USDINR=X, label: USDINR, decimals: 2, session: NSE }
    - { symbol: BTC-USD, label: BTC, risk: true, crypto: true }
    - { symbol: ETH-USD, label: ETH, risk: true, crypto: true }
    - { symbol: ^GSPC, label: SPX, risk: true, equity: true, session: NYSE }
    - { symbol: ^NDX, label: NDX, risk: true, equity: true, session: NYSE }
    - { symbol: GC=F, label: GOLD, risk: true, session: NYSE }
  sessions:
    - { name: NSE, tz: Asia/Kolkata, open: "09:15", close: "15:30" }
    - { name: NYSE, tz: America/New_York, open: "09:30", close: "16:00" }
  options: [BTC, ETH]
  perps: [BTC, ETH, SOL]

# ── FLOW: how you ship ────────────────────────────────────────────────────────
flow:
  # Shaded bands on the commit-hour histogram, in your timezone.
  bands:
    - [0, 4, 3AM GRIND]
    - [9, 16, NSE OPEN]
    - [19, 24, EVENING]
  snake: true
  recent: 5
  # forks and tutorial repos kept out of "recent pushes"
  hide: [langchain, gemini-cli, FalkorDB, mercur, daytona, introduction-to-github, skills-introduction-to-github, myfirstgit, anurag-23werty]
