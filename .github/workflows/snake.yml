name: Generate snake animation

on:
  schedule:
    - cron: "0 19 * * *"   # daily, ~00:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      # Colours match the README banner: cobalt contribution dots, amber snake (the "drift")
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#C97F12&color_dots=#DDE4EB,#B9C8F3,#8BA5EE,#5A7FE9,#2F5BEA
            dist/snake-dark.svg?color_snake=#F0A93B&color_dots=#161B22,#1E3266,#2E4C99,#4F73D9,#7FA2FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
