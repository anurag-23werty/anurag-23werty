<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-label="TourScout: Tour-planning agent for indie musicians, grounded in Qloo taste data: finds cities with fans who've never seen them live.">
<style>
    .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    .in{animation:fade .7s ease-out backwards;}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .glow{animation:glow 3.2s ease-in-out infinite;}
    @keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.9}}
    .accent{fill:#9B8CFF;}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
    
.route{animation:dash 1.6s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-20}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.7s ease-out infinite;}
@keyframes pulse{0%{transform:scale(.4);opacity:.5}100%{transform:scale(1.8);opacity:0}}
</style>
<rect x="1" y="1" width="518" height="268" rx="16" fill="#0D1424" stroke="#1F2B45" stroke-width="1.5"/>
<rect x="1" y="1" width="518" height="268" rx="16" fill="none" stroke="#9B8CFF" stroke-width="1.5" class="glow"/>
<circle cx="34" cy="34" r="4" class="accent"/>
<text class="m" x="46" y="38" font-size="11" letter-spacing="1.4" fill="#9B8CFF">AI AGENT · MCP</text>
<text class="t" x="28" y="76" font-size="27" font-weight="700" fill="#E6EDF3">TourScout</text>
<text class="t" x="28" y="104" font-size="14" fill="#9FB0C3">Tour-planning agent for indie musicians,</text><text class="t" x="28" y="124" font-size="14" fill="#9FB0C3">grounded in Qloo taste data: finds cities</text><text class="t" x="28" y="144" font-size="14" fill="#9FB0C3">with fans who've never seen them live.</text>
<g class="in" style="animation-delay:0.35s"><text class="t" x="28" y="200" font-size="24" font-weight="700" fill="#E6EDF3">7</text><text class="m" x="28" y="219" font-size="11" fill="#5F7089">MCP tools</text></g><g class="in" style="animation-delay:0.53s"><text class="t" x="146" y="200" font-size="24" font-weight="700" fill="#E6EDF3">Live</text><text class="m" x="146" y="219" font-size="11" fill="#5F7089">web demo</text></g><g class="in" style="animation-delay:0.71s"><text class="t" x="264" y="200" font-size="24" font-weight="700" fill="#E6EDF3">HITL</text><text class="m" x="264" y="219" font-size="11" fill="#5F7089">pick your cities</text></g>
<line x1="28" y1="236" x2="492" y2="236" stroke="#1F2B45"/>
<text class="m" x="28" y="255" font-size="11.5" fill="#5F7089">LangGraph · MCP · Gemini · FastAPI · React · Neon</text>
<g transform="translate(330,24)"><path d="M18 104 L52 60 L92 92 L128 38" fill="none" stroke="#F0A93B" stroke-width="2" stroke-dasharray="5 5" class="route"/><circle cx="18" cy="104" r="11" fill="#9B8CFF" opacity=".18" class="pulse" style="animation-delay:0.00s"/><circle cx="18" cy="104" r="4" fill="#9B8CFF"/><circle cx="52" cy="60" r="11" fill="#9B8CFF" opacity=".18" class="pulse" style="animation-delay:0.45s"/><circle cx="52" cy="60" r="4" fill="#9B8CFF"/><circle cx="92" cy="92" r="11" fill="#9B8CFF" opacity=".18" class="pulse" style="animation-delay:0.90s"/><circle cx="92" cy="92" r="4" fill="#9B8CFF"/><circle cx="128" cy="38" r="11" fill="#9B8CFF" opacity=".18" class="pulse" style="animation-delay:1.35s"/><circle cx="128" cy="38" r="4" fill="#9B8CFF"/><circle cx="150" cy="112" r="11" fill="#9B8CFF" opacity=".18" class="pulse" style="animation-delay:1.80s"/><circle cx="150" cy="112" r="4" fill="#9B8CFF"/><circle cx="70" cy="128" r="11" fill="#9B8CFF" opacity=".18" class="pulse" style="animation-delay:2.25s"/><circle cx="70" cy="128" r="4" fill="#9B8CFF"/><text class="m" x="0" y="150" font-size="10" fill="#5F7089">unserved demand → stops</text></g>
</svg>