<text class="t" x="28" y="76" font-size="27" font-weight="700" fill="#E6EDF3">VulnGraph</text>
<text class="t" x="28" y="104" font-size="14" fill="#9FB0C3">Ranks CVEs by attack paths that actually</text><text class="t" x="28" y="124" font-size="14" fill="#9FB0C3">reach your assets, so a quiet 5.3 can</text><text class="t" x="28" y="144" font-size="14" fill="#9FB0C3">outrank a 9.8 that goes nowhere.</text>
