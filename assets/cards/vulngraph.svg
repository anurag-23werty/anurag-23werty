<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-label="VulnGraph: Ranks CVEs by attack paths that actually reach your assets, so a quiet 5.3 can outrank a 9.8 that goes nowhere.">
<style>
    .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    .in{animation:fade .7s ease-out backwards;}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .glow{animation:glow 3.2s ease-in-out infinite;}
    @keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.9}}
    .accent{fill:#FF6B6B;}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
    
.atk{animation:dash 1.2s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-24}}
</style>
<rect x="1" y="1" width="518" height="268" rx="16" fill="#0D1424" stroke="#1F2B45" stroke-width="1.5"/>
<rect x="1" y="1" width="518" height="268" rx="16" fill="none" stroke="#FF6B6B" stroke-width="1.5" class="glow"/>
